<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a station header with actions, the coordination bridge, the station (an elevator shaft and rows of department rooms of different widths), the legend; a list tab; a modal for the robot sheet and the order form. The station is a deliberate single dark theme. */
:root {
  --ink: #0b0f18;
  --space: #070a12;
  --panel: #0b1019;
  --panel-2: #121826;
  --line: #2c3548;
  --fg: #d6dde8;
  --fg-strong: #eef2f7;
  --muted: #8a95a8;
  --cyan: #6fe3f5;
  --cyan-ink: #06222a;
  --amber: #ffb43a;
  --amber-ink: #1a1205;
  --red: #e0564f;
  --green: #7fd6a0;
  --font-pixel: "Silkscreen", "Courier New", monospace;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: dark;
}
html, body { background: #05070c; overflow-x: hidden; }
body { color: var(--fg); font-family: var(--font-mono); font-size: 13px; line-height: 1.45; }
.wrap { max-width: 1680px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 14px; }
.pixel { font-family: var(--font-pixel); letter-spacing: 1px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--font-pixel); font-size: 22px; letter-spacing: 2px; color: var(--fg-strong); font-weight: 400; }
.sub { font-size: 11px; color: var(--muted); }
.emblem { align-self: center; display: inline-flex; filter: drop-shadow(0 0 6px rgba(111, 227, 245, .35)); }
.clock { align-self: center; font-family: var(--font-pixel); font-size: 10px; color: var(--cyan); background: var(--panel); border: 2px solid #2c5560; padding: 3px 8px; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font-family: var(--font-pixel); font-size: 11px; padding: 8px 12px; border: 2px solid var(--ink); cursor: pointer; min-height: 36px; }
.btn-cyan { background: var(--cyan); color: var(--cyan-ink); box-shadow: inset -2px -2px 0 #36a6ba, inset 2px 2px 0 #c8f7ff; }
.btn-amber { background: var(--amber); color: var(--amber-ink); box-shadow: inset -2px -2px 0 #c7841c, inset 2px 2px 0 #ffd88f; display: flex; gap: 8px; align-items: center; }
.btn-amber .mark { background: var(--amber-ink); color: var(--amber); width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
.btn-dark { background: #2a3244; color: #e6ebf2; box-shadow: inset -2px -2px 0 #1b2231, inset 2px 2px 0 #46516a; }
.btn-ghost { background: #1a2130; color: #c9d2e0; font-size: 10px; padding: 5px 8px; min-height: 0; }
.btn:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, .tab:focus-visible, .slot:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.pill { display: flex; align-items: center; gap: 7px; background: var(--panel); border: 2px solid #2c5560; color: #bff6ff; font-size: 11px; padding: 7px 12px; }
.pill i { width: 8px; height: 8px; background: var(--cyan); display: inline-block; }
button.pill { font-family: inherit; cursor: pointer; }
button.pill[aria-pressed="true"] { border-color: var(--cyan); box-shadow: 0 0 8px rgba(111,227,245,.45); }
/* With the working pill pressed, the robots at work stand out and the rest fade. */
body.spot-working .slot.busy { outline: 2px solid var(--cyan); outline-offset: 3px; box-shadow: 0 0 14px rgba(111,227,245,.55); }
body.spot-working .slot:not(.busy), body.spot-working .actor { opacity: .35; }
.tabs { display: flex; gap: 4px; }
.tab { font-family: var(--font-pixel); font-size: 11px; background: transparent; color: var(--muted); border: 2px solid var(--line); padding: 6px 10px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--line); color: var(--fg-strong); }
.status-line { font-size: 11px; color: var(--muted); margin: 0; }

/* two columns on wide screens: the bridge on the left, the whole station on the right */
.layout { display: grid; grid-template-columns: clamp(420px, 26%, 520px) minmax(0, 1fr); gap: 14px; align-items: start; }
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
.main { display: grid; gap: 14px; min-width: 0; }
.side .bridge { flex-direction: column; flex-wrap: nowrap; }
.side .bridge > * { flex: none !important; min-width: 0; }
.side .map, .side .orders-box, .side .queue { min-width: 0; }
.side .order-row { grid-template-columns: 96px minmax(0, 1fr) 52px; align-items: start; border-top: 1px solid #2a3142; padding-top: 6px; }
.side .order-row .txt { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.side .order-row .to { grid-column: 2 / span 2; grid-row: 2; }
.side .proposal { grid-template-columns: minmax(0, 1fr); }
.side .proposal .ops { grid-column: 1; grid-row: auto; margin-top: 6px; padding-top: 8px; border-top: 1px dashed #3a2c55; }
@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; overflow: visible; }
  .side .bridge { flex-direction: row; flex-wrap: wrap; }
  .side .bridge > * { flex: revert !important; }
  .side .map { flex: 0 1 300px !important; min-width: 240px; }
  .side .orders-box { flex: 1 1 320px !important; }
}
/* bridge */
.bridge { position: relative; background: linear-gradient(180deg, #232b3c 0, #1b2231 100%); border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); padding: 14px 16px 22px; display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; overflow: hidden; }
.bridge::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: repeating-linear-gradient(90deg, #3a4356 0 30px, #141924 30px 32px); border-top: 3px solid #5a647b; }
.plate { display: inline-flex; align-items: center; gap: 8px; background: #2f384c; border: 2px solid var(--ink); box-shadow: inset 1px 1px 0 #4a5570, inset -1px -1px 0 #1d2433; padding: 4px 8px; font-family: var(--font-pixel); font-size: 11px; color: var(--fg-strong); white-space: nowrap; }
.plate::before, .plate::after { content: ""; width: 3px; height: 3px; background: var(--ink); }
.plate.wait { border-color: var(--amber); }
.bang { width: 20px; height: 20px; flex: none; background: var(--amber); color: var(--amber-ink); font-family: var(--font-pixel); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--ink); }
.queue { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
.shelf { display: flex; flex-wrap: wrap; align-content: flex-end; gap: 6px 4px; min-height: 40px; padding: 6px; background: #141a26; border: 3px solid var(--ink); border-bottom: 5px solid #5a647b; }
.map { flex: 0 1 300px; min-width: 240px; background: #0a1d24; border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px #2c5560; padding: 9px 10px; display: grid; gap: 7px; align-content: start; }
.map-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; }
.map-grid::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: #2c5560; }
.map-cell { position: relative; height: 22px; border: 2px solid; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; font-size: 9px; white-space: nowrap; overflow: hidden; }
.orders-box { flex: 1 1 320px; min-width: 0; background: var(--panel); border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); padding: 9px 12px; display: grid; gap: 5px; align-content: start; }
.proposals { flex: 1 1 100%; background: #1a1428; border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px #6b4fa0; padding: 9px 12px; display: grid; gap: 8px; }
.proposal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; border-top: 1px solid #2c2140; padding-top: 8px; }
.proposal:first-of-type { border-top: 0; padding-top: 0; }
.proposal > :not(.ops) { grid-column: 1; }
/* The reason leads, as the line that decides; who asks whom and the order
   itself follow in smaller, quieter type. */
.proposal .why { font-size: 13px; line-height: 1.4; font-weight: 600; color: #f3eeff; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.proposal .who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11px; color: #a596c4; }
.proposal .to-chip { font-family: var(--font-pixel); font-weight: 400; font-size: 9px; letter-spacing: 1px; color: #1a1428; background: #c9a7ff; padding: 1px 6px; }
.proposal .txt { font-size: 11.5px; line-height: 1.45; color: #c7bce0; border-left: 2px solid #4b3a6e; padding-left: 8px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proposal .meta { font-size: 10.5px; color: #8f82a8; }
.proposal .ops { grid-column: 2; grid-row: 1 / span 4; display: flex; flex-wrap: wrap; gap: 6px; }
.proposal .ops .view { display: flex; gap: 6px; margin-left: auto; }
.order-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 200px) 70px; gap: 10px; align-items: center; font-size: 11px; }
.order-row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dotlbl { display: flex; gap: 6px; align-items: center; }
.dotlbl i { width: 8px; height: 8px; flex: none; display: inline-block; }
.box-title { font-family: var(--font-pixel); font-size: 10px; color: var(--muted); }
.todo { flex: 1 1 100%; min-width: 0; background: #241d10; border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px #6e5420; padding: 9px 12px; display: grid; gap: 6px; align-content: start; }
.todo-group { font-family: var(--font-pixel); font-size: 9px; color: #e8c477; margin-top: 4px; }
.todo-dept { display: grid; gap: 5px; padding: 7px 9px 8px 10px; background: rgba(0, 0, 0, .22); border-left: 4px solid var(--acc, #e8c477); }
.todo-dept-head { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-pixel); font-size: 9px; color: var(--acc, #e8c477); letter-spacing: 1px; }
.todo-dept-head span:last-child { color: #8f8061; letter-spacing: 0; }
.todo-dept-head + .todo-item { border-top: 0; padding-top: 0; }
.todo-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 11px; color: #f1e6cc; text-decoration: none; border-top: 1px solid #3a2f18; padding-top: 5px; }
.todo-item:hover .t { text-decoration: underline; }
.todo-item .t { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clickable { cursor: pointer; }
.clickable:hover { background: rgba(111,227,245,.06); }
.detail-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--fg-strong); background: #0d121b; border: 2px solid var(--line); padding: 10px; max-height: 40vh; overflow-y: auto; }
.todo-item .m { grid-column: 1 / span 2; color: #b8a77f; font-size: 10px; }
.todo-item .a { color: #8f8061; font-size: 10px; white-space: nowrap; }
.todo-item .discard { grid-column: 1 / span 2; justify-self: start; font-size: 10px; padding: 3px 8px; }

/* station */
.station { position: relative; background: var(--space); padding: 10px 34px 10px 76px; overflow: hidden; }
.stars { position: absolute; inset: 0; pointer-events: none; }
/* The shaft and its car are sized for a robot riding inside (42 x 54 px on wide screens). */
.shaft { position: absolute; left: 10px; top: 10px; bottom: 10px; width: 58px; background: linear-gradient(90deg, var(--ink) 0 3px, #4a5570 3px 6px, rgba(140,190,220,.10) 6px 12px, rgba(200,235,255,.22) 12px 16px, rgba(140,190,220,.08) 16px 52px, #4a5570 52px 55px, var(--ink) 55px); }
.shaft::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 52px, var(--ink) 52px 54px, #566078 54px 60px, var(--ink) 60px 62px); }
/* A capsule waits at the top of the shaft while its order is being handed over,
   and drops once to its room when delivered. */
.capsule { position: absolute; left: 34px; top: 10px; z-index: 2; }
.capsule.waiting { animation: pulse 1.1s steps(2) infinite; }
.capsule.dropping { opacity: 0; animation: drop 3.2s steps(24) 1 forwards; }
body.no-motion .capsule.dropping { display: none; }
.rows { position: relative; display: grid; gap: 14px; }
/* Fitted to the screen: lines of decks, every line as tall as the others. */
body.fit .wrap { max-width: none; padding-block-end: 0; }
.station.fit .deck-line { display: flex; align-items: stretch; min-width: 0; }
.station.fit .deck-part { flex: none; grid-template-rows: auto 1fr; }
.station.fit .deck-door { align-self: flex-end; }
.station.fit .row { flex-wrap: nowrap; }
.station.fit .room { flex: none; min-height: 0; }
.station.fit .room, .station.fit .door { box-sizing: border-box; }
.station.fit .room-in { min-height: 0; padding-top: 8px; }
.station.fit .group-label { min-width: 0; }
.station.fit .niches { margin-top: 6px; }
/* On the grid, subagents' niches are narrower and their names one line (the full name is in the tooltip). */
.station.fit .niche { width: calc(var(--scale) * 12px + 14px); }
.station.fit .niche small { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station.fit .rows { gap: 10px; }
/* The bridge can be folded away, giving the station the whole width. */
.layout.no-bridge { grid-template-columns: minmax(0, 1fr); }
.layout.no-bridge .side { display: none; }
.legend.in-bridge { margin-top: 14px; }
.group { display: grid; gap: 6px; }
.group-label { font-size: 9px; color: #8a95a8; display: flex; align-items: center; gap: 8px; }
.group-label .beam { flex: 1; height: 8px; border: 2px solid var(--ink); background: radial-gradient(circle at 6px 50%, #6b7487 0 1.5px, rgba(0,0,0,0) 2px) 0 0 / 24px 100% repeat-x, linear-gradient(180deg, #3a4356 0, #2a3142 60%, #1d2433 100%); }
/* Position lights, steady and dim: they mark the deck, never an event in it. */
.group-label .deck-light { width: 6px; height: 6px; flex: none; background: #e0564f; border: 1px solid var(--ink); opacity: .35; }
.group-label .deck-light.green { background: #5fd69a; }
.row { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; }
.door { flex: 0 0 14px; align-self: flex-end; height: 60px; margin-bottom: 14px; background: #0b1018; border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px #4a5570; position: relative; }
.door::before { content: ""; position: absolute; left: 3px; right: 3px; top: 4px; height: 2px; background: #5fd69a; animation: blink 3s steps(2) infinite; }
.shaft-door { position: absolute; left: 0; bottom: 14px; width: 9px; height: 60px; background: #0b1018; border-right: 2px solid #4a5570; z-index: 1; }
.car { position: absolute; left: 4px; top: 0; width: 50px; height: 66px; box-sizing: border-box; background: linear-gradient(180deg, #2f384c 0, #3a4458 100%); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px #566078, inset 0 -6px 0 #2a3244; z-index: 1; }
.car::before { content: ""; position: absolute; left: 4px; right: 4px; top: 4px; height: 3px; background: #ffd88f; opacity: .55; }
.car::after { content: ""; position: absolute; left: 50%; top: 9px; bottom: 8px; width: 2px; margin-left: -1px; background: rgba(11,15,24,.55); }
.car .rider { position: absolute; left: 2px; bottom: 6px; z-index: 1; }
.actor-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.actor { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; background: none; border: 0; padding: 0; }
.actor[hidden] { display: none; }
.actor-flip { position: relative; width: fit-content; }
/* A room stretched by its row (to the height of the tallest room) passes the
   height on to its inside, so desks and furniture always stand on the floor. */
.room { position: relative; min-height: 236px; flex: 1 1 260px; display: flex; flex-direction: column; border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.room.wait { border-color: var(--amber); }
.room-bg { position: absolute; inset: 0; }
.room-lights { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #2c3548; border-bottom: 2px solid var(--ink); }
.room-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; border-top: 3px solid #5a647b; }
.room-dark { position: absolute; inset: 0; background: rgba(2,4,8,.72); }
/* windows to space */
/* isolation keeps the glass, glint and mullion layers inside the window, so
   desks, niches and robots always draw in front of it */
.porthole { isolation: isolate; position: absolute; top: 46px; right: 18px; width: 132px; height: 60px; background: #03050b; border: 3px solid var(--ink); border-radius: 10px; box-shadow: inset 0 0 0 3px #4a5570, inset 0 0 0 5px #1d2433, 0 0 0 2px #2c3548; overflow: hidden; }
.porthole::before { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(115deg, rgba(255,255,255,.12) 0 16%, rgba(255,255,255,0) 16% 100%); }
.porthole.dawn::after, .porthole.dusk::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(0deg, rgba(255,150,80,.35), rgba(255,150,80,0) 70%); }
.porthole .mullion { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1px; z-index: 3; background: #1d2433; box-shadow: 1px 0 0 #4a5570; }
/* ceiling lamps: the cone of light follows what happens in the room */
.lamp { position: absolute; top: 8px; width: 26px; height: 5px; margin-left: -13px; background: #5d6679; border: 1px solid var(--ink); }
.lamp::after { content: ""; position: absolute; top: 5px; left: 50%; width: 170px; height: 190px; margin-left: -85px; pointer-events: none; clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, var(--beam, rgba(0,0,0,0)) 0, rgba(0,0,0,0) 100%); }
.room.lit-working { --beam: rgba(255, 238, 200, .16); }
.room.lit-waiting { --beam: rgba(255, 180, 58, .2); }
.room.lit-standby { --beam: rgba(170, 205, 255, .08); }
.room.lit-offline { --beam: rgba(224, 86, 79, .08); }
.room.lit-working .lamp, .room.lit-waiting .lamp { background: #ffe9b8; box-shadow: 0 0 8px rgba(255, 220, 150, .6); }
.room.lit-waiting .lamp { animation: pulse 1.2s steps(2) infinite; }
/* neon signs */
.plate.neon { color: #fff; text-shadow: 0 0 4px var(--acc), 0 0 1px var(--acc); }
/* shadows under robots and furniture */
.slot { position: relative; }
.slot::before, .actor::before { content: ""; position: absolute; left: 14%; right: 14%; bottom: -3px; height: 5px; border-radius: 50%; background: rgba(0, 0, 0, .38); }
.furniture svg, .floorline > svg, .steamy svg { filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .3)); }
/* shared rooms: string lights in the canteen, charging robots in the hangar */
.string-lights { position: absolute; left: 6px; right: 6px; top: 10px; height: 10px; pointer-events: none; background: radial-gradient(circle, #ffd88f 0 2px, rgba(0,0,0,0) 3px) 0 2px / 22px 8px repeat-x, radial-gradient(circle, #f28fb1 0 2px, rgba(0,0,0,0) 3px) 11px 4px / 22px 8px repeat-x; filter: drop-shadow(0 0 3px rgba(255, 216, 143, .7)); animation: blink 2.6s steps(2) infinite; }
.string-lights::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: #5e432c; }
.actor.charging::after { content: ""; position: absolute; left: 50%; top: -12px; width: 12px; height: 7px; margin-left: -6px; border: 1px solid var(--ink); background: linear-gradient(90deg, #5fd69a 0 var(--charge, 40%), #1d2433 var(--charge, 40%)); box-shadow: 0 0 6px rgba(95, 214, 154, .6); animation: charge 3s steps(4) infinite; }
.actor.charging .actor-flip { filter: drop-shadow(0 0 4px rgba(95, 214, 154, .55)); }
@keyframes charge { 0% { --charge: 25% } 25% { --charge: 50% } 50% { --charge: 75% } 75%, 100% { --charge: 100% } }
@property --charge { syntax: "<percentage>"; inherits: false; initial-value: 40%; }
/* steam from the canteen table */
.steamy { position: relative; }
.steam { position: absolute; left: 22px; bottom: 26px; width: 2px; height: 8px; background: rgba(233, 227, 211, .5); animation: steam 2.4s steps(8) infinite; }
.steam.s2 { left: 27px; animation-delay: -1.2s; }
@keyframes steam { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: .8 } 100% { transform: translateY(-16px); opacity: 0 } }
/* a cleaning drone crosses a deck now and then */
.cleaner { position: absolute; z-index: 3; left: 0; pointer-events: none; animation: sweep 48s linear infinite; }
@keyframes sweep { 0% { transform: translateX(var(--from)); opacity: 1 } 34% { transform: translateX(var(--to)); opacity: 1 } 35%, 100% { transform: translateX(var(--to)); opacity: 0 } }
body.no-motion .cleaner { display: none; }
.room-in { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; padding: 14px 12px 17px; min-height: 236px; box-sizing: border-box; }
.room-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
/* The room's line sits on a dark chip, so it reads over the window and the canteen's lights. */
.room-head > .sub { position: relative; z-index: 1; background: rgba(6, 9, 16, .62); padding: 1px 6px; }
.niches { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.niche { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.niche:hover small, .niche:focus-visible small { color: var(--cyan); }
.niche:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.niche small { font-size: 8.5px; line-height: 10px; text-align: center; overflow-wrap: anywhere; }

// ---------- idle robots: a small state machine per robot ----------
// Each idle robot decides on its own when to stop, where to walk and how fast.
// A robot idle for a while sometimes calls the elevator, rides to the canteen,

const TICK_MS = 1000 / 12;

// A standing robot that can walk: two frames (standing, legs apart), a visor

function walker(s, u) {

  const frames = [STAND, STEP].map((rows, i) => el("div", { style: Object.assign({ position: i ? "absolute" : "relative", left: 0, top: 0, visibility: i ? "hidden" : "visible" }, size) }, robotParts(s, "standby", "front", rows, 0, 0, u)));

// A robot idle for a while sometimes leaves its room: to the hangar to

  const sleepy = isSmallHours();
  if (a.room.startsWith("#")) { a.sleeping = false; a.goal = a.home; a.state = "toShaft"; return; }

  // A robot idle for a while sometimes stops where it is for a long nap.

  for (const a of actors.values()) {

    if (a.state === "pause" && now >= a.until) decide(a, now);
    if (a.state === "walk" || a.state === "toShaft" || a.state === "fromShaft") {

    el("button", { class: "btn btn-ghost", type: "button", onclick: () => { demo.sessions = []; demo.orders = []; demo.phase = null; demo.sleepy = false; redrawStation(); } }, tr("CLEAR TESTS"))),

// ---------- wiring ----------
function setView(v) {
  view = v;
  document.getElementById("tab-station").setAttribute("aria-selected", String(v === "station"));
  document.getElementById("tab-list").setAttribute("aria-selected", String(v === "list"));
  document.getElementById("view-station").hidden = v !== "station";
  document.getElementById("view-list").hidden = v !== "list";
  try { localStorage.setItem("office-view", v); } catch {}
  render();
}
function setMotion(isOn, isSaved) {
  document.body.classList.toggle("no-motion", !isOn);
  const b = document.getElementById("motion-btn");
  b.setAttribute("aria-pressed", String(isOn));
  b.textContent = isOn ? tr("ANIMATION: ON") : tr("ANIMATION: OFF");
  if (isSaved) try { localStorage.setItem("office-motion", isOn ? "on" : "off"); } catch {}
}

async function start() {
  loadStationThemes();
  document.getElementById("emblem").append(spr(EMBLEM, { K: INK, C: "#6fe3f5", A: "#2c5560", W: "#121826", Y: "#ffb43a" }, 2));
  try { view = localStorage.getItem("office-view") === "list" ? "list" : "station"; } catch {}
  let savedMotion = null;
  try { savedMotion = localStorage.getItem("office-motion"); } catch {}
  setMotion(savedMotion ? savedMotion === "on" : true, false);
  let savedSound = null;
  try { savedSound = localStorage.getItem("office-sound"); } catch {}
  setSound(savedSound === "on", false);
  document.getElementById("sound-btn").onclick = () => { setSound(!soundOn, true); if (soundOn) { ensureAudio(); sfx("ding"); } };
  // Browsers only start audio after a click: wake it on the first one.
  document.addEventListener("pointerdown", () => { if (soundOn) ensureAudio(); }, { once: true });
  // The bridge is shown unless this viewer folded it away.
  let bridgeShown = true;
  try { bridgeShown = localStorage.getItem("office-bridge") !== "off"; } catch {}
  const setBridge = (isShown, isSaved) => {
    document.querySelector("#view-station .layout").classList.toggle("no-bridge", !isShown);
    const b = document.getElementById("bridge-btn");
    b.setAttribute("aria-pressed", String(isShown)); b.textContent = isShown ? tr("BRIDGE: ON") : tr("BRIDGE: OFF");
    if (isSaved) try { localStorage.setItem("office-bridge", isShown ? "on" : "off"); } catch {}
  };
  setBridge(bridgeShown, false);
  document.fonts?.ready?.then(() => { fitCache = { width: 0, u: 0, fewer: 0 }; lastStationRender = 0; render(); });
  document.getElementById("bridge-btn").onclick = () => { bridgeShown = !bridgeShown; setBridge(bridgeShown, true); lastStationRender = 0; render(); };
  // The working pill marks the robots at work, and brings the first one into view.
  document.getElementById("work-pill").onclick = () => {
    const isOn = !document.body.classList.contains("spot-working");
    document.body.classList.toggle("spot-working", isOn);
    document.getElementById("work-pill").setAttribute("aria-pressed", String(isOn));
    if (!isOn) return;
    if (view !== "station") setView("station");
    const first = document.querySelector("#station .slot.busy"), box = first?.getBoundingClientRect();
    if (box && (box.top < 0 || box.bottom > window.innerHeight)) first.scrollIntoView({ block: "center" });
  };
  document.getElementById("motion-btn").onclick = () => { setMotion(document.body.classList.contains("no-motion"), true); render(); };
  document.getElementById("test-btn").onclick = () => {
    const p = document.getElementById("test-panel"), b = document.getElementById("test-btn");
    p.hidden = !p.hidden; b.setAttribute("aria-pressed", String(!p.hidden));
    if (!p.hidden) renderTestPanel();
  };
  document.getElementById("tab-station").onclick = () => setView("station");
  document.getElementById("tab-list").onclick = () => setView("list");
  document.getElementById("new-order").onclick = () => openSheet(null);
  document.getElementById("config-btn").onclick = openConfig;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("modal").hidden) (modalOnClose || closeModal)(); });
  setView(view);
  setInterval(() => { if (!form) render(true); }, 30000);
  let resizeTimer; window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 200); });
  const status = document.getElementById("status");
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { status.textContent = tr("The station is not available in this view. Open it with the account that published it."); return; }
  const onError = err => { status.textContent = tr("The station could not be read{code}. Reload the page to try again.", { code: err?.code ? ` (${err.code})` : "" }); };
  // Re-render only when the data changed, so running animations are not restarted by no-op snapshots.
  let lastSignature = "";
  const touch = () => {
    status.textContent = tr("Updates on its own. Last signal: {time}.", { time: new Date().toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" }) });
    const signature = JSON.stringify([sessions, orders, dispatchers, agentsCatalog.scannedAt || 0, handoffs.scannedAt || 0, departmentsVersion]);
    if (signature === lastSignature || form) return;
    lastSignature = signature;
    render();
  };
  db.collection("sessions").onSnapshot(snap => { sessions = snap.docs.map(d => ({ sessionId: d.id, ...d.data() })); sessionsRead = true; touch(); }, onError);
  db.collection("orders").onSnapshot(snap => { orders = snap.docs.map(d => ({ id: d.id, ...d.data() })); touch(); }, onError);
  db.collection("dispatchers").onSnapshot(snap => { dispatchers = snap.docs.map(d => d.data()); touch(); }, onError);
  db.doc("config/models").onSnapshot(snap => { configModels = snap.exists ? snap.data() : {}; }, onError);
  db.doc("config/agents").onSnapshot(snap => { agentsCatalog = snap.exists ? snap.data() : {}; touch(); }, onError);
  await loadSeed();
  // A station without repos opens its configuration once, so a new station
  // starts by choosing them (from the template, when there is one).
  let hasOfferedSetup = false;
  db.doc("config/departments").onSnapshot(snap => {
    applyDepartments(snap.exists ? snap.data() : {}); departmentsVersion++; touch();
    if (!hasOfferedSetup && !snap.metadata?.fromCache) {
      hasOfferedSetup = true;
      if (!REPOS.length && document.getElementById("modal").hidden) openConfig();
    }
  }, onError);
  db.doc("config/handoffs").onSnapshot(snap => { handoffs = snap.exists ? snap.data() : {}; touch(); }, onError);
}
start();
</script>
