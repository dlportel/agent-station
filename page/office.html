<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;600&display=swap">
<!-- The station page. Its styles and its code live next to it, in station.css and station.js,
     so republishing a station replaces those files without reading them. -->
<link rel="stylesheet" href="station.css">

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="emblem" id="emblem" aria-hidden="true"></span><h1>STATION</h1><span class="ver" id="page-version"></span><span class="sub" id="open-text">Connecting…</span></div>
    <div class="actions">
      <button class="btn btn-amber" id="wait-btn" type="button" hidden><span class="mark">!</span><span id="wait-text"></span></button>
      <button class="btn btn-amber" id="nodisp-btn" type="button" hidden><span class="mark">!</span><span id="nodisp-text"></span></button>
      <button class="btn btn-dark" id="prop-btn" type="button" hidden></button>
      <button class="pill" id="work-pill" type="button" aria-pressed="false" data-tr-title="Marks the robots at work in the station" title="Marks the robots at work in the station"><i></i><span id="work-text">0 trabajando</span></button>
      <button class="btn btn-cyan" id="new-order" type="button" data-tr="+ GIVE ORDER">+ GIVE ORDER</button>
      <button class="tab" id="bridge-btn" type="button" aria-pressed="true">BRIDGE: ON</button>
      <button class="tab" id="motion-btn" type="button" aria-pressed="true">ANIMATION: ON</button>
      <button class="tab" id="sound-btn" type="button" aria-pressed="false">SOUND: OFF</button>
      <button class="tab" id="test-btn" type="button" aria-pressed="false" data-tr="TESTS">TESTS</button>
      <button class="tab" id="config-btn" type="button" data-tr="CONFIGURE">CONFIGURE</button>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-station" aria-selected="true" type="button" data-tr="STATION">STATION</button>
        <button class="tab" role="tab" id="tab-list" aria-selected="false" type="button" data-tr="LIST">LIST</button>
      </div>
      <span class="clock" id="ship-clock-box"><i class="signal" id="signal" aria-hidden="true"></i><span><span id="ship-clock"></span><span id="ship-shift"></span></span></span>
    </div>
  </div>
  <p class="status-line" id="status">Connecting to the station…</p>
  <div class="test-panel" id="test-panel" hidden></div>

  <section id="view-station" aria-label="Station" data-tr-aria="Station">
    <div class="layout">
      <aside class="side" aria-label="Coordination" data-tr-aria="Coordination"><div class="bridge" id="bridge"></div></aside>
      <div class="main">
        <div class="station" id="station"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </section>
  <section id="view-list" aria-label="Session list" data-tr-aria="Session list" hidden>
    <div class="list" id="list"></div>
  </section>
</div>
<div class="modal" id="modal" hidden></div>

<script src="station.js"></script>
